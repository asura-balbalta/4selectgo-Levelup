# docs/ 폴더를 GitHub Pages 로 배포한다.
# 저장소 Settings → Pages 의 Source 가 "GitHub Actions" 여야 한다.
# 예: docs/privacy/index.html → https://asura-balbalta.github.io/4selectgo-Levelup/privacy/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 배포가 겹치면 진행 중인 것은 끝까지 두고 대기 중인 것만 최신으로 바꾼다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 올리기와 배포를 한 작업에 두면 배포 단계가 방금 올린 묶음을 못 찾는 일이 있어 두 작업으로 나눈다
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload docs folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
